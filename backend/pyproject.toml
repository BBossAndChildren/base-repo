[project]
name = "adult-prince-backend"
version = "0.1.0"
description = "어른왕자 Django API 서버"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "django-cors-headers>=4.9,<5",
    "django-environ>=0.12,<0.13",
    "drf-spectacular>=0.28,<0.30",
    "gunicorn>=23,<24",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
