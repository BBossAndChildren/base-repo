map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /srv/static/;
    }

    location /builds/ {
        alias /srv/builds/;
        autoindex off;
        types {
            text/html html;
            application/javascript js;
            application/wasm wasm;
            application/octet-stream data;
            application/json json;
            audio/mpeg mp3;
            text/css css;
        }
        add_header Content-Security-Policy "frame-ancestors https://base-repo-ck83.vercel.app" always;
        add_header Access-Control-Allow-Origin "https://base-repo-ck83.vercel.app" always;
        add_header Vary "Origin" always;
    }

    location /intro-assets/ {
        alias /srv/intro-assets/;
        autoindex off;
        types {
            application/json json;
            model/gltf-binary glb;
        }
        limit_except GET { deny all; }
        add_header Access-Control-Allow-Origin "https://base-repo-ck83.vercel.app" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "public, max-age=604800";
    }
}
