services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "False"
      DB_HOST: db
      DB_PORT: "5432"
      GUNICORN_BIND: "0.0.0.0:8000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - static_files:/app/backend/staticfiles
    # 같은 서버의 호스트에서 도는 AI API 를 http://host.docker.internal:<포트> 로 부른다
    # (컨테이너의 127.0.0.1 은 컨테이너 자신이다. 06-deployment.md 5-3)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          r = urllib.request.Request('http://127.0.0.1:8000/api/health',
          headers={'Host': os.environ.get('HEALTHCHECK_HOST') or 'localhost'});
          urllib.request.urlopen(r, timeout=5).close()
      interval: 10s
      timeout: 6s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  static_files:
