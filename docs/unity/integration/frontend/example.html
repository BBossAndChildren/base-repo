<!doctype html><html lang="ko"><meta charset="utf-8"><title>완성 체험 중간 테스트</title>
<style>body{font:16px system-ui;margin:20px;background:#f4f6f8}button,input{padding:8px;margin:4px}iframe{width:100%;height:76vh;border:0}pre{white-space:pre-wrap;max-height:30vh;overflow:auto}</style>
<h1>완성 체험 중간 테스트</h1><p>URL의 ?scenarioId=고정ID로 호출합니다. 기본값은 행사기획자입니다. 실제 서비스 연결 전 로컬 수신기입니다.</p>
<button id="start" disabled>체험 시작</button><button id="end">종료 · 결과 받기</button><button id="retry">마지막 요청 재전송</button><button id="flush">대기 이벤트 전송</button><button id="download">JSON 내려받기</button>
<label><input id="offline" type="checkbox">전송 실패 시험</label><p id="status">준비 중</p><p id="ack"></p><iframe id="game" title="Unity 체험"></iframe><pre id="result"></pre>
<script type="module">
import {createExperienceClient,createOutbox} from './client.js';
const manifest=await fetch('../manifest.json').then(r=>r.json());
const scenarioId=new URLSearchParams(location.search).get('scenarioId')||'career-net-951-experience';
const selection=manifest.supported.find(x=>x.scenarioId===scenarioId);if(!selection)throw Error('UNSUPPORTED_SCENARIO');
const frame=document.querySelector('iframe');frame.src='../site/index.html?parentOrigin='+encodeURIComponent(location.origin);
const outbox=createOutbox({send:async event=>{if(document.querySelector('#offline').checked)throw Error('SIMULATED_NETWORK_FAILURE');const r=await fetch('/__local/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(event)});if(!r.ok)throw Error('LOCAL_RECEIVER_'+r.status);return r.json();},onChange:rows=>{document.querySelector('#ack').textContent=`로컬 디스크 ACK ${rows.filter(r=>r.status==='stored').length} / 대기 ${rows.filter(r=>r.status!=='stored').length} · 실서비스 저장 검증 아님`;}});
let lastRequest=null;
const client=createExperienceClient({frame,manifest,outbox,onStatus:s=>{document.querySelector('#status').textContent=s.value;document.querySelector('#start').disabled=s.value!=='ready'&&s.value!=='ended_received';},onEvent:e=>{if(e.type==='experience.ended')document.querySelector('#result').textContent=JSON.stringify({process:e.process,result:e.result,context:e.context},null,2);}});
window.preview={client,outbox,manifest};
async function call(fn){try{await fn();}catch(e){document.querySelector('#status').textContent=e.code||e.message;}}
document.querySelector('#start').onclick=()=>call(()=>{lastRequest=crypto.randomUUID();return client.start(selection,{requestId:lastRequest});});
document.querySelector('#end').onclick=()=>call(()=>{lastRequest=crypto.randomUUID();return client.end({requestId:lastRequest});});
document.querySelector('#retry').onclick=()=>call(()=>client.retry(lastRequest));
document.querySelector('#flush').onclick=()=>outbox.flush();setInterval(()=>outbox.flush(),2000);
document.querySelector('#download').onclick=()=>{const blob=new Blob([JSON.stringify({schema_version:3,protocol:'career-experience',protocolVersion:'v001',events:client.state().events},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='actual-events.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script></html>
